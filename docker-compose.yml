services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: paiflow
      POSTGRES_PASSWORD: paiflow
      POSTGRES_DB: paiflow
    ports:
      - "5432:5432"
    volumes:
      - paiflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paiflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core", "full"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - paiflow_redis:/data

volumes:
  paiflow_pg:
  paiflow_redis:
