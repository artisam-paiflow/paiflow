# Nixpacks build hints for Railway

[phases.setup]
# This archive provides Node 22.23.4, but its shared Brotli needs the pinned
# security patch in nix/node-runtime.nix. Node's version alone is insufficient.
nixpkgsArchive = "fb7f563bfe8c946201d132e50c9b0f526f983890"
# The runtime uses only the pinned archive, not the provider's mutable npm overlay.
nixOverlays = []
nixPkgs = ["(import ../nix/node-runtime.nix { inherit pkgs; })"]
# Nixpacks copies these files before installing the setup phase's Nix packages.
onlyIncludeFiles = ["nix/node-runtime.nix"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm db:generate",
  "pnpm build",
]

[start]
cmd = "sh scripts/start-railway.sh"
